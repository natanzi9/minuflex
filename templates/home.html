<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>

<body>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">MINUFLEX</div>

        <nav class="sidebar-nav">
            <a class="sidebar-item active" href="#">Assistente IA</a>
            <a class="sidebar-item" href="#">Tarefas</a>
            <a class="sidebar-item" href="#">Histórico</a>
        </nav>
    </aside>

    <main class="content">
        <header class="saudacao">
            <h1>OLÁ, USUÁRIO!</h1>
            <p>Bem-vindo ao Minuflex</p>
        </header>

        <section class="chat">
            <img src="{{ url_for('static', filename='icone.png') }}" alt="Minuflex" class="icone">
            <h2>COMO PODEMOS TE AJUDAR?</h2>
            <p class="chat-subtitulo">Descreva sua tarefa que a Minuflex irá auxiliar</p>

            <div class="chat-box">
                <div class="chat-messages" id="chatMessages"></div>

                <form class="chat-input" id="chatForm">
                    <input type="text" id="userInput" placeholder="Digite sua mensagem..." required>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='home.js') }}"></script>
</body>

</html>
